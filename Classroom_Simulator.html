<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b3144; --head:#363d55; --tile:#393f5a; --tile-b:#424a66; --box:#2e3448;
  --lime:#cdf24a; --blue:#5b8cff; --lbl:#1d2131; --red:#ff4d5e; --txt:#e8eaf1; --muted:#a3a9bd;
  --btn:#3c4360; --btn-on:#4b5377; --kl:#2a2e3d; --kl-head:#383d55;
  --coach:#ffd34d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

/* ---------- Classroom header ---------- */
.cr-head{height:56px;background:var(--head);display:flex;align-items:center;padding:0 18px;gap:12px;position:relative}
.cr-head .back{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.cr-head .back:hover{background:#4a5274}
.cr-head b{font-size:15px;font-weight:700}
.cr-head .muted{color:var(--muted);font-size:13px}
.leave{margin-left:auto;color:var(--red);font-size:13px;display:flex;align-items:center;gap:6px}
.hud{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.hud-chip{background:#262b3c;border:1px solid #545d80;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.hud-chip.mode{background:var(--coach);color:#2a2410;border-color:var(--coach)}
.heart{font-size:14px;transition:.3s}
.heart.lost{filter:grayscale(1);opacity:.35}
.heart.breaking{animation:heartBreak .8s ease}
@keyframes heartBreak{0%{transform:scale(1)}30%{transform:scale(1.6)}60%{transform:scale(.6) rotate(-20deg)}100%{transform:scale(1)}}
.dia-pop{animation:diaPop .9s ease}
@keyframes diaPop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ---------- Console ---------- */
.console{height:calc(100vh - 56px);padding:16px 14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.room-box{border:1px solid var(--tile-b);border-radius:14px;padding:4px;background:var(--box);position:relative;min-height:0}
.room-box.joined{cursor:pointer}
.room-box.joined:hover{border-color:#6d7799}
.room-inner{height:100%;border-radius:11px;background:var(--tile);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.room-box.joined .room-inner{background:var(--box);align-items:flex-start;justify-content:flex-start}
.tag{position:absolute;top:8px;left:8px;background:var(--lbl);font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;z-index:2;display:flex;align-items:center;gap:6px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime)}
.av{width:60px;height:60px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:22px;color:#24305a;font-weight:500}
.lbl{position:absolute;left:8px;bottom:8px;background:var(--lbl);font-size:12px;padding:5px 10px;border-radius:5px;display:flex;align-items:center;gap:6px;white-space:nowrap;z-index:2}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.bars i{width:2.5px;background:#3fd16b;border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}
.minis{display:flex;gap:4px;padding:0}
.mini{position:relative;border-radius:9px;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center}
.mini img{width:100%;height:100%;object-fit:cover}
.console .mini{width:242px;height:148px}
.console .mini .av{width:60px;height:60px}
.console .minis{padding:0}
.side .mini{width:78px;height:64px}
.side .mini .av{width:30px;height:30px;font-size:13px}
.side .mini .lbl{font-size:10px;padding:2px 5px;left:3px;bottom:3px;max-width:70px;overflow:hidden}
.side .room-box.joined .room-inner{padding:2px}
.side .room-box.joined .tag{top:6px;left:6px}

/* ---------- Room layout ---------- */
.room-layout{height:calc(100vh - 56px);display:flex;gap:14px;padding:16px 14px}
.side{width:262px;flex:0 0 262px;display:flex;flex-direction:column;gap:14px}
.side .room-box{flex:1}
.side .av{width:60px;height:60px}
.frame{flex:1;min-width:0;border:2px solid var(--lime);border-radius:14px;padding:6px;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.frame-tag{top:12px;left:12px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.vt{position:relative;background:var(--tile);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;transition:box-shadow .2s}
.vt.student img{height:100%;width:auto;max-width:100%;object-fit:cover;aspect-ratio:16/9}
.vt .dots{position:absolute;top:8px;right:8px;width:28px;height:26px;border-radius:6px;background:var(--lbl);font-size:14px;line-height:1}
.vt.speaking{box-shadow:inset 0 0 0 3px #3fd16b}
.follow-badge{position:absolute;top:8px;left:8px;background:#fff;color:#1d2131;font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;display:flex;gap:5px;align-items:center;z-index:3;animation:fadeIn .4s}
.stage.tasks{flex-direction:row;gap:14px}
.kl{flex:1;min-width:0;background:var(--kl);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.kl-head{height:64px;background:var(--kl-head);display:flex;align-items:center;padding:16px 16px 0;flex:0 0 auto}
.kl-logo{font-family:Unbounded,Inter,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em}
.kl-right{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:14px}
.theme{display:flex;align-items:center;gap:6px;color:#7f87a8}
.theme .sw{width:58px;height:30px;border-radius:999px;background:#2a2f40;position:relative}
.theme .sw::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#7c84b0;top:3px;left:31px}
.lang{border:1px solid #9aa0b5;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600}
.kl-user{display:flex;align-items:center;gap:10px}
.kl-av{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#c9d4ff,#6c79c9);border:2px solid #fff}
.kl-body{flex:1;min-height:0;display:flex}
.kl-rail{width:40px;flex:0 0 40px;border-right:1px solid #3d4258;padding-top:10px;display:flex;justify-content:center}
.atom{width:28px;height:28px;border-radius:6px;background:var(--blue);display:grid;place-items:center}
.kl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.kl-title{padding:16px 24px 12px;font-size:15px;font-weight:600}
.task-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 24px;scroll-behavior:smooth}
.task-scroll::-webkit-scrollbar{width:12px}
.task-scroll::-webkit-scrollbar-track{background:#fff;border-radius:2px}
.task-scroll::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:6px;border:3px solid #fff}
.right-col{width:228px;flex:0 0 228px;border:1px solid #3d4460;border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px}
.right-col .vt{flex:0 0 124px}
.right-col .vt .av{width:58px;height:58px}
.right-col .vt.student img{width:100%;height:100%}
.right-col .lbl{font-size:12px}

/* ---------- Toolbar ---------- */
.tb{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:8px 6px 2px;position:relative}
.tb-l,.tb-c{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-btn{white-space:nowrap}
.tb-c{margin:0 auto}
.tb-btn,.tb-ico,.ib,.lead,.nav button{height:40px;border-radius:10px;background:var(--btn);display:flex;align-items:center;gap:8px;font-size:13px;position:relative;transition:background .15s}
.tb-btn{padding:0 14px}
.tb-btn.on{background:var(--btn-on);box-shadow:inset 0 0 0 1px #8a93b8}
.tb-group{display:flex;border-radius:10px;background:var(--btn)}
.tb-group .tb-btn,.tb-group .tb-ico{background:transparent}
.tb-ico{width:42px;justify-content:center}
.tb-group:hover .tb-btn{background:var(--blue);border-radius:10px 0 0 10px}
.tb-group.on{background:var(--btn-on)}
.tb-ico:hover{background:#525b82 !important}
.nav{display:flex;border-radius:10px;background:var(--btn-on);overflow:hidden}
.nav button{width:46px;justify-content:center;background:transparent;border-radius:0}
.nav button:hover{background:#5d6790}
.lead{padding:0 12px 0 14px;cursor:pointer;user-select:none;white-space:nowrap}
.lead .sw{width:34px;height:20px;border-radius:999px;border:2px solid #fff;position:relative;transition:.25s;background:transparent}
.lead .sw::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.25s}
.lead.on .sw{background:var(--blue);border-color:var(--blue)}
.lead.on .sw::after{left:16px}
.lead.flash{animation:leadFlash 1s ease}
@keyframes leadFlash{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 4px rgba(91,140,255,.6)}}
.ib{width:40px;justify-content:center}
.ib:hover{background:#4a5274}
.pair{display:flex;border-radius:10px;background:var(--btn)}
.pair .ib{background:transparent}
.pair .ib+.ib{width:36px;border-left:1px solid #2f3550;border-radius:0 10px 10px 0}
.ib.cnt{width:auto;padding:0 14px;gap:12px}
.end{margin-left:auto;height:40px;border-radius:10px;background:var(--btn);color:var(--red);padding:0 14px;display:flex;align-items:center;gap:8px;font-size:13px}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#fff;color:#222;font-size:12px;padding:4px 8px;white-space:nowrap;z-index:50;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* ---------- Activity dropdown ---------- */
.dd{position:absolute;left:104px;bottom:62px;width:450px;height:400px;background:#363d55;border:1px solid #9aa0b5;border-radius:8px;z-index:20;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dd-scroll{height:100%;overflow-y:auto;padding:4px}
.dd-item{padding:11px 16px;font-size:14px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.dd-item:hover{background:#454d6c}
.dd-item.sel{background:#5a6286}

/* ---------- Activity content (kodland dark) ---------- */
.task{max-width:720px;margin:0 auto;padding:6px 0 60px;font-size:15px;line-height:1.65;color:#e4e6ee}
.task h1{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:33px;line-height:1.2;margin:22px 0 16px}
.task h2{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:23px;margin:26px 0 10px}
.task h3{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:19px;margin:20px 0 8px}
.task p{margin:8px 0}
.task ul,.task ol{padding-left:22px;margin:6px 0}
.task li{margin:6px 0}
.task blockquote{border-left:3px solid #8b90a4;margin:16px 0;padding:2px 0 2px 16px;color:#a9aec1}
.banner{width:100%;display:block;border-radius:14px;margin:14px 0}
.media{display:flex;gap:22px;align-items:flex-start;margin:16px 0}
.media-img{flex:0 0 44%;background:#fde9e6;padding:10px;border-radius:16px}
.media.narrow .media-img{flex-basis:25%}
.media-img img{width:100%;display:block;border-radius:10px}
.media-c{flex:1;min-width:0}
.media-c h3{margin-top:4px}
.spoiler{border:1px solid #c5c8d3;border-radius:12px;margin:10px 0;overflow:hidden}
.spoiler summary{list-style:none;padding:12px 16px;font-weight:600;cursor:pointer;display:flex;gap:12px;align-items:center}
.spoiler summary::-webkit-details-marker{display:none}
.spoiler summary::before{content:"▸";font-size:10px;color:#a9aec1;transition:.2s}
.spoiler[open] summary::before{transform:rotate(90deg)}
.spoiler[open] summary{border-bottom:1px solid #c5c8d3}
.sp-body{padding:6px 20px 10px}
.note{background:#353c54;border-left:3px solid var(--blue);border-radius:12px;padding:14px 22px;margin:16px 0}
.note-t{color:#6f97ff;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tnotes{border:1px dashed #a97a26;background:#32333e;border-radius:12px;padding:16px 18px 10px;margin:22px 0}
.tn-label{color:#c98b1e;font-size:13px;margin-bottom:4px}
.tnotes h1{font-size:30px}
.tnotes video{width:100%;border-radius:10px;margin:10px 0;background:#000}
.quiz label{display:flex;gap:12px;align-items:center;border:1px solid #c5c8d3;border-radius:10px;padding:11px 16px;margin:8px 0;cursor:pointer}
.quiz input{width:18px;height:18px;accent-color:#ec5fa6}
.submit{display:block;margin:12px auto;background:#ec5fa6;color:#fff;border:3px solid #fff;border-radius:10px;padding:8px 16px;font-weight:600}
.sim-note{color:#a9aec1;font-style:italic;border:1px dashed #5c6380;border-radius:10px;padding:12px 16px}
.center-img{display:block;max-width:470px;width:100%;margin:12px auto;border-radius:14px}

/* ---------- Simulator layers (guide, decisions, modals) ---------- */
#spot{position:fixed;border-radius:12px;pointer-events:none;z-index:900;box-shadow:0 0 0 9999px rgba(10,12,22,.55);display:none}
#spot::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:3px solid var(--coach);animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(1)}70%{opacity:0;transform:scale(1.06)}100%{opacity:0}}
#coach{position:fixed;z-index:950;width:350px;background:#fff;color:#1f2433;border-radius:16px;padding:18px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:none;transition:left .3s,top .3s;border-top:6px solid var(--coach)}
#coach .c-step{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a07a00}
#coach h4{margin:6px 0 8px;font-size:17px}
#coach p{margin:0;font-size:14px;line-height:1.55;color:#3a4052}
#coach .c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
#coach .c-hint{font-size:12px;color:#8a7020;font-weight:600}
#coach.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.btn-p{background:#1f2433;color:#fff;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px}
.btn-p:hover{background:#3a4260}
.btn-y{background:var(--coach);color:#2a2410;border-radius:12px;padding:13px 26px;font-weight:700;font-size:15px}
.btn-y:hover{filter:brightness(1.05)}

#qp{position:fixed;z-index:800;width:560px;background:#fff;color:#1f2433;border-radius:18px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;border-top:6px solid var(--coach);animation:fadeIn .35s}
#qp.busy{opacity:.55;pointer-events:none}
.qp-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#a07a00}
.qp-q{font-size:15.5px;line-height:1.55;margin:10px 0 14px;font-weight:500}
.qp-opt{width:100%;text-align:left;display:flex;gap:12px;align-items:center;border:2px solid #e2e5ee;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14.5px;color:#1f2433;background:#fafbfd;transition:.15s}
.qp-opt:hover{border-color:var(--blue);background:#f1f5ff}
.qp-opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:#1f2433;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.qp-opt.tried{opacity:.45;pointer-events:none;text-decoration:line-through}

#caption{position:fixed;z-index:850;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(20,23,35,.92);border:1px solid #545d80;color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;display:none;max-width:640px;align-items:center;gap:10px;animation:fadeIn .25s}
#caption .who{font-weight:700;color:var(--coach)}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:#3fd16b;animation:eq .6s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

#modal{position:fixed;inset:0;z-index:1000;background:rgba(10,12,22,.7);display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.m-card{width:min(560px,92vw);background:#fff;color:#1f2433;border-radius:22px;padding:30px 32px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:popIn .35s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.m-icon{font-size:52px;line-height:1}
.m-card h2{margin:12px 0 8px;font-size:24px}
.m-card p{color:#454b5e;font-size:15px;line-height:1.6;margin:8px 0}
.m-card .m-lives{font-size:24px;margin:12px 0 4px;letter-spacing:4px}
.m-card .btns{margin-top:20px;display:flex;gap:10px;justify-content:center}
.m-card.bad{border-top:8px solid var(--red)}
.m-card.good{border-top:8px solid #2fbf68}
.m-card.info{border-top:8px solid var(--coach)}

#intro{position:fixed;inset:0;z-index:1100;background:radial-gradient(1200px 600px at 20% 0%,#3b4570 0%,#232839 60%);display:none;overflow:auto}
.intro-wrap{max-width:900px;margin:0 auto;padding:56px 24px 40px}
.intro-kicker{display:inline-block;background:var(--coach);color:#2a2410;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:6px 14px}
.intro-wrap h1{font-family:Unbounded,Inter,sans-serif;font-size:42px;line-height:1.15;margin:18px 0 14px}
.intro-wrap h1 span{background:var(--lime);color:#1d2131;padding:0 10px;border-radius:10px}
.intro-wrap .lead-p{font-size:17px;line-height:1.65;color:#cfd3e2;max-width:760px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}
.fact{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px}
.fact .fi{font-size:28px}
.fact b{display:block;margin:10px 0 4px;font-size:15px}
.fact span{font-size:13px;color:#b9bed0;line-height:1.5}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:30px}
.phase{border-radius:16px;padding:18px 20px;background:#2c3247;border:1px solid #454d6b}
.phase .pn{font-size:12px;font-weight:700;color:var(--lime);letter-spacing:.08em;text-transform:uppercase}
.phase b{display:block;margin:6px 0;font-size:16px}
.phase span{color:#b9bed0;font-size:14px;line-height:1.55}
#toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:1050;background:#fff;color:#1f2433;font-size:13.5px;font-weight:600;border-radius:999px;padding:9px 18px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;animation:fadeIn .25s}
@media (max-width:900px){.facts{grid-template-columns:1fr 1fr}.phases{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="spot"></div>
<div id="coach"></div>
<div id="qp"></div>
<div id="caption"></div>
<div id="toast"></div>
<div id="modal"></div>
<div id="intro"></div>

<script>
/* =========================================================
   ASSETS
   ========================================================= */
const IMG = 'Pictures_students/';
const AUDIO = 'Audios/';
const P = {
  sofia: IMG + 'girl.png',
  alexander: IMG + 'boy%202.png',
  valentina: IMG + 'girl%202.png',
  mateo: IMG + 'boy.png',
  getReadyTop: IMG + 'c2f3c92a-c4de-40c4-abfc-6efb1add6968.png',
  getReadyBottom: IMG + '2a35aafd-d169-4e99-a7cb-4658f3c788be.png',
  equipment: IMG + '9fb18454-c457-49e1-aca0-4acc7535e017.jpg',
  welcomeTop: IMG + '0183f2c0-5241-4e38-a786-28e7ea158c0c.png',

/* =========================================================

   ========================================================= */
function perform(action, arg){
  const r = S.room !== null ? curRoom() : null;
  switch(action){
    case 'enterRoom':
      if (!S.rooms[arg].joined) return false;
      S.view = 'room'; S.room = +arg; S.dropdown = false; break;
    case 'back': S.view = 'console'; S.dropdown = false; break;
    case 'classroom': r.mode = 'classroom'; S.dropdown = false; break;
    case 'openTasks':
      if (r.activity === null) S.dropdown = !S.dropdown;
      else { r.mode = 'tasks'; S.dropdown = false; }
      break;
    case 'toggleDropdown': S.dropdown = !S.dropdown; break;
    case 'pickActivity': r.activity = +arg; r.mode = 'tasks'; S.dropdown = false; break;
    case 'toggleLead': r.lead = !r.lead; break;
    case 'nextTask': if (r.activity < ACTIVITIES.length - 1) r.activity++; break;
    case 'prevTask': if (r.activity > 0) r.activity--; break;
    default: return false;
  }
  render();
  return true;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !$('#app').contains(el)) return;
  const action = el.dataset.action, arg = el.dataset.arg;
  const key = arg !== undefined ? `${action}:${arg}` : action;

  if (S.phase === 'guide'){
    const step = GUIDE[S.step];
    if (step.accept && step.accept.includes(key)){ perform(action, arg); nextGuide(); }
    else nudge();
    return;
  }
  if (S.phase === 'game'){
    gameClick(action, arg, key);
    return;
  }
});

function startGuide(){
  $('#intro').style.display = 'none';

}
function enterStep(){
  const st = GUIDE[S.step];
  if (st.clock !== undefined) S.clock = st.clock;
  if (st.enter) st.enter();
  if (st.scrollTo && S.room !== null) curRoom().scrollTo = st.scrollTo;
  render();
  if (st.scrollTo){ const el = document.getElementById(st.scrollTo), sc = $('#taskScroll'); if (el && sc){ sc.style.scrollBehavior='auto'; sc.scrollTop = el.offsetTop - 20; sc.style.scrollBehavior=''; } }
}
function nextGuide(){
  const st = GUIDE[S.step];
  if (st.last){ finishGuide(); return; }
  S.step++;
  enterStep();
}
function nudge(){
  const c = $('#coach');
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}

function renderCoach(){
  const coach = $('#coach'), spot = $('#spot');
  if (S.phase !== 'guide'){ coach.style.display = 'none'; spot.style.display = 'none'; return; }
  const st = GUIDE[S.step];
  coach.innerHTML = `<div class="c-step">Guided tour · ${S.step + 1}/${GUIDE.length}</div><h4>${st.title}</h4><p>${st.text}</p>
    <div class="c-foot">${st.next ? '<span></span><button class="btn-p" id="coachNext">Next →</button>' : '<span class="c-hint">👆 Click the highlighted element</span><span></span>'}</div>`;
  coach.style.display = 'block';
  const btn = $('#coachNext'); if (btn) btn.onclick = nextGuide;

  const t = st.target ? document.querySelector(st.target) : null;
  const vw = innerWidth, vh = innerHeight, m = 16, pad = 6;
  let r = null;
  if (t){
    r = t.getBoundingClientRect();
    // keep spotlight inside the scroll container when the target is inside it
    const sc = t.closest('.task-scroll');
    if (sc && sc !== t){
      const b = sc.getBoundingClientRect();
      r = { left:r.left, right:r.right, top:Math.max(r.top,b.top), bottom:Math.min(r.bottom,b.bottom), width:r.width };
      r.height = Math.max(0, r.bottom - r.top);
    }
    Object.assign(spot.style, { display:'block', left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px' });
  } else spot.style.display = 'none';

  const cw = coach.offsetWidth, ch = coach.offsetHeight;
  let x, y;
  const fits = (x,y) => x >= 8 && y >= 64 && x + cw <= vw - 8 && y + ch <= vh - 8;
  const clampX = x => Math.min(Math.max(8, x), vw - cw - 8);
  const clampY = y => Math.min(Math.max(64, y), vh - ch - 8);
  if (!r){ x = (vw - cw) / 2; y = (vh - ch) / 2; }
  else {
    const cands = [
      [r.right + m + pad, clampY(r.top + r.height/2 - ch/2)],
      [r.left - m - pad - cw, clampY(r.top + r.height/2 - ch/2)],
      [clampX(r.left + r.width/2 - cw/2), r.top - m - pad - ch],
      [clampX(r.left + r.width/2 - cw/2), r.bottom + m + pad]
    ];
    const ok = cands.find(c => fits(c[0], c[1]));
    if (ok){ [x, y] = ok; } else { x = vw - cw - 20; y = 76; }
  }
  coach.style.left = x + 'px'; coach.style.top = y + 'px';
}

let qIndex = 0;

function gameClick(action, arg, key){
  // While a decision is open, the real Lead the group switch counts as choosing that option
  if ($('#qp').style.display === 'block' && !S.busy && action === 'toggleLead'){
    const i = QUESTIONS[qIndex].options.findIndex(o => o.kind === 'do');
    if (i >= 0) choose(i);
    return;
  }
  if (action === 'deco' || S.busy) return;
  if ($('#qp').style.display === 'block'){ toast('Make your decision in the panel 👇'); return; }
}

function showQuestion(){
  const Q = QUESTIONS[qIndex];
  S.busy = false;
  const qp = $('#qp');
  qp.className = '';
  qp.innerHTML = `<div class="qp-head"><span>${Q.tag}</span><span>${Q.who}</span></div>
    <p class="qp-q">${Q.q}</p>
    ${Q.options.map((o,i) => `<button class="qp-opt ${S.tried.includes(i) ? 'tried' : ''}" data-opt="${i}"><span class="k">${'ABC'[i]}</span><span>${o.label}</span></button>`).join('')}`;
  qp.style.display = 'block';
  qp.querySelectorAll('.qp-opt').forEach(b => b.onclick = () => choose(+b.dataset.opt));
  placeOverlays();
}

function choose(i){
  if (S.busy) return;
  S.busy = true;
  const Q = QUESTIONS[qIndex], o = Q.options[i];
  $('#qp').classList.add('busy');

  if (o.kind === 'do'){
    // The tutor performs the action in the interface first
    S.rooms[Q.room].lead = true; S.following = true;
    render();
    const lt = $('#leadToggle'); if (lt) lt.classList.add('flash');
    setTimeout(() => correct(o), 1300);
  } else {
    // The tutor says the line, then the student answers (audio), then feedback
    caption(`<span class="who">You:</span> “${o.say}”`);
    setTimeout(() => {
      S.speaking = Q.room; render();
      caption(`<span class="eq"><i></i><i></i><i></i><i></i></span><span class="who">${S.rooms[Q.room].name}</span> is answering…`);
      playAudio(AUDIO + o.audio, () => {
        S.speaking = null; render(); caption(null);
        wrong(i, o);
      });
    }, 1900);
  }
}

function playAudio(src, done){
  const a = new Audio(src);
  let fin = false;
  const f = () => { if (fin) return; fin = true; done(); };
  a.onended = () => setTimeout(f, 400);
  a.onerror = () => setTimeout(f, 1500);
  a.play().catch(() => setTimeout(f, 2500));
  setTimeout(f, 25000);
}

function wrong(i, o){
  S.lives--;
  S.tried.push(i);
  render();
  const h = $('#heart-' + S.lives); if (h){ h.classList.add('breaking'); }
  $('#qp').style.display = 'none';
  if (S.lives <= 0){
    modal(`<div class="m-card bad">
      <div class="m-icon">💔</div><h2>Game over</h2>
      <p>${o.why}</p>
      <p>You’ve lost your 3 lives, so you’ll start the simulation again from the beginning — guided tour included.</p>
      <div class="m-lives">🖤🖤🖤</div>
      <div class="btns"><button class="btn-y" id="mRestart">Restart simulation</button></div></div>`);
    $('#mRestart').onclick = restart;
  } else {
    modal(`<div class="m-card bad">
      <div class="m-icon">❌</div><h2>${o.title}</h2>
      <p>${o.why}</p>
      <div class="m-lives">${'❤️'.repeat(S.lives)}${'🖤'.repeat(3 - S.lives)}</div>
      <p style="font-size:13px;color:#7a8094">${S.lives} ${S.lives === 1 ? 'life' : 'lives'} left</p>
      <div class="btns"><button class="btn-y" id="mRetry">Try again</button></div></div>`);
    $('#mRetry').onclick = () => { closeModal(); showQuestion(); };
  }
}

function correct(o){
  S.diamonds++;
  render();
  const d = $('#dia'); if (d) d.classList.add('dia-pop');
  $('#qp').style.display = 'none';
  modal(`<div class="m-card good">
    <div class="m-icon">💎</div><h2>${o.title}</h2>
    <p>${o.why}</p>
    <div class="btns"><button class="btn-y" id="mCont">Continue</button></div></div>`);
  $('#mCont').onclick = () => {
    qIndex++;
    S.tried = [];
    if (qIndex < QUESTIONS.length){ closeModal(); showQuestion(); }
    else finish();
  };
}

function finish(){
  S.phase = 'done';
  render();
  modal(`<div class="m-card info">
    <div class="m-icon">🏁</div><h2>Scenario complete!</h2>
    <p>You reached the end of the first part of the simulation.</p>
    <div class="m-lives">${'❤️'.repeat(S.lives)}${'🖤'.repeat(3 - S.lives)} &nbsp; 💎 ${S.diamonds}</div>
    <p>More situations from the parallel lesson are coming soon.</p>
    <div class="btns"><button class="btn-p" id="mAgain">Play again</button></div></div>`);
  $('#mAgain').onclick = restart;
}

function restart(){
  closeModal(); caption(null);
  $('#qp').style.display = 'none';
  qIndex = 0;
  S = freshState();
  render();
  showIntro();
}
